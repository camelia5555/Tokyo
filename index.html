<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>旅のしおり - 東京五日漫遊</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Noto Sans JP', sans-serif; background-color: #f7f6f2; color: #333333; -webkit-tap-highlight-color: transparent; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-[#f7f6f2] min-h-screen flex justify-center">

    <!-- 手機容器外框 -->
    <div id="app" class="w-full max-w-md bg-[#ffffff] min-h-screen shadow-xl flex flex-col relative pb-28">
        
        <!-- 頂部導航列 -->
        <header class="sticky top-0 z-40 bg-[#ffffff]/95 backdrop-blur-md border-b border-[#e5e5e0] px-5 py-4 flex justify-between items-center">
            <div>
                <span class="text-[10px] tracking-widest text-[#8c8c82] uppercase font-medium">Tokyo 5-Days Trip</span>
                <h1 id="tripTitle" class="text-base font-bold text-[#262622]">9/9 - 9/13 東京自由行</h1>
            </div>
            <button onclick="openModal('addModal')" class="w-9 h-9 rounded-full bg-[#262622] text-white flex items-center justify-center text-sm shadow-sm active:scale-95 transition">
                <i class="fa-solid fa-plus"></i>
            </button>
        </header>

        <!-- 日期選擇橫向滾動列 (僅在行程分頁顯示) -->
        <div id="dateTabBar" class="bg-[#fafaf8] border-b border-[#e5e5e0] px-4 py-2.5 gap-2 overflow-x-auto hide-scrollbar sticky top-[65px] z-30 hidden">
            <!-- 渲染日期標籤 -->
        </div>

        <!-- 主要內容顯示區 -->
        <main class="flex-1 p-4 space-y-4" id="mainContentArea">
            <!-- 動態載入頁面 -->
        </main>

        <!-- 底部導覽列 -->
        <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-[#ffffff] border-t border-[#e5e5e0] py-2 px-3 flex justify-around items-center z-40 shadow-lg">
            <button onclick="switchTab('overview')" id="nav-btn-overview" class="flex flex-col items-center text-[#262622] font-bold p-1.5 transition">
                <i class="fa-solid fa-house text-base mb-0.5"></i>
                <span class="text-[10px] tracking-wider">總覽</span>
            </button>
            <button onclick="switchTab('prep')" id="nav-btn-prep" class="flex flex-col items-center text-[#8c8c82] p-1.5 transition">
                <i class="fa-solid fa-suitcase-rolling text-base mb-0.5"></i>
                <span class="text-[10px] tracking-wider">準備</span>
            </button>
            <button onclick="switchTab('hotel')" id="nav-btn-hotel" class="flex flex-col items-center text-[#8c8c82] p-1.5 transition">
                <i class="fa-solid fa-hotel text-base mb-0.5"></i>
                <span class="text-[10px] tracking-wider">住宿</span>
            </button>
            <button onclick="switchTab('itinerary')" id="nav-btn-itinerary" class="flex flex-col items-center text-[#8c8c82] p-1.5 transition">
                <i class="fa-solid fa-map-location-dot text-base mb-0.5"></i>
                <span class="text-[10px] tracking-wider">行程</span>
            </button>
            <button onclick="switchTab('bills')" id="nav-btn-bills" class="flex flex-col items-center text-[#8c8c82] p-1.5 transition">
                <i class="fa-solid fa-wallet text-base mb-0.5"></i>
                <span class="text-[10px] tracking-wider">分帳</span>
            </button>
        </nav>

        <!-- 美食部落客精選介紹彈跳視窗 -->
        <div id="foodBlogModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
            <div class="bg-white w-full max-w-sm rounded-2xl p-6 shadow-2xl space-y-4 max-h-[85vh] overflow-y-auto animate-in fade-in zoom-in duration-200">
                <div class="flex justify-between items-center border-b border-[#e5e5e0] pb-3">
                    <h3 id="blogTitle" class="font-bold text-base text-[#262622]">店家情報</h3>
                    <button onclick="closeModal('foodBlogModal')" class="text-[#8c8c82] text-lg p-1"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div id="blogContent" class="space-y-3 text-xs text-[#52524a]">
                    <!-- 動態填入部落客介紹與菜單內容 -->
                </div>
                <button onclick="closeModal('foodBlogModal')" class="w-full bg-[#262622] text-white py-2.5 rounded-xl font-medium text-sm transition">關閉</button>
            </div>
        </div>

        <!-- 新增住宿周邊地點 Modal -->
        <div id="hotelPlaceModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 hidden flex items-end justify-center">
            <div class="bg-white w-full max-w-md rounded-t-2xl p-6 max-h-[85vh] overflow-y-auto shadow-2xl">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="font-bold text-base text-[#262622]">新增住宿周邊地點</h3>
                    <button onclick="closeModal('hotelPlaceModal')" class="text-[#8c8c82] text-lg p-2"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <form id="hotelPlaceForm" onsubmit="handleSaveHotelPlace(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs text-[#8c8c82] mb-1">選擇分類</label>
                        <select id="hpCatSelect" class="w-full bg-[#fafaf8] border border-[#e5e5e0] rounded-lg p-3 text-sm focus:outline-none focus:border-[#262622]">
                            <!-- 動態填入 -->
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs text-[#8c8c82] mb-1">店名 / 地點名稱</label>
                        <input type="text" id="hpName" placeholder="例如: 7-11 新大塚站前店" required class="w-full bg-[#fafaf8] border border-[#e5e5e0] rounded-lg p-3 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs text-[#8c8c82] mb-1">營業時間</label>
                        <input type="text" id="hpHours" placeholder="例如: 24小時營業 或 09:00 - 22:00" required class="w-full bg-[#fafaf8] border border-[#e5e5e0] rounded-lg p-3 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs text-[#8c8c82] mb-1">Google 地圖連結 (URL)</label>
                        <input type="url" id="hpUrl" placeholder="請貼上 Google 地圖分享網址" required class="w-full bg-[#fafaf8] border border-[#e5e5e0] rounded-lg p-3 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs text-[#8c8c82] mb-1">備註 / 推薦品項 (選填)</label>
                        <input type="text" id="hpNote" placeholder="例如: 𖤐必吃招牌或特色說明" class="w-full bg-[#fafaf8] border border-[#e5e5e0] rounded-lg p-3 text-sm">
                    </div>
                    <button type="submit" class="w-full bg-[#262622] text-white py-3.5 rounded-xl font-medium text-sm shadow-md active:scale-95 transition">確認新增地點</button>
                </form>
            </div>
        </div>

        <!-- 新增行程 Modal -->
        <div id="addModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 hidden flex items-end justify-center">
            <div class="bg-white w-full max-w-md rounded-t-2xl p-6 max-h-[85vh] overflow-y-auto shadow-2xl">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="font-bold text-base text-[#262622]">新增行程項目</h3>
                    <button onclick="closeModal('addModal')" class="text-[#8c8c82] text-lg p-2"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <form id="addForm" onsubmit="handleAddItem(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs text-[#8c8c82] mb-1">選擇天數</label>
                        <select id="inputDay" class="w-full bg-[#fafaf8] border border-[#e5e5e0] rounded-lg p-3 text-sm focus:outline-none focus:border-[#262622]">
                            <option value="1">Day 1 (9/9 三)</option>
                            <option value="2">Day 2 (9/10 四)</option>
                            <option value="3">Day 3 (9/11 五)</option>
                            <option value="4">Day 4 (9/12 六)</option>
                            <option value="5">Day 5 (9/13 日)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs text-[#8c8c82] mb-1">項目分類</label>
                        <select id="inputType" class="w-full bg-[#fafaf8] border border-[#e5e5e0] rounded-lg p-3 text-sm focus:outline-none focus:border-[#262622]">
                            <option value="attraction">景點 (Attraction)</option>
                            <option value="restaurant">餐廳 (Restaurant)</option>
                            <option value="transport">交通 (Transport)</option>
                        </select>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-xs text-[#8c8c82] mb-1">時間</label>
                            <input type="text" id="inputTime" placeholder="例: 09:30" required class="w-full bg-[#fafaf8] border border-[#e5e5e0] rounded-lg p-3 text-sm">
                        </div>
                        <div>
                            <label class="block text-xs text-[#8c8c82] mb-1">地點名稱</label>
                            <input type="text" id="inputLocation" placeholder="例: 淺草寺" required class="w-full bg-[#fafaf8] border border-[#e5e5e0] rounded-lg p-3 text-sm">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs text-[#8c8c82] mb-1">行程內容與高亮關鍵字</label>
                        <textarea id="inputDesc" rows="3" placeholder="例如：必吃美食: 雷門人形燒；重要預約代號: #TK-8823" required class="w-full bg-[#fafaf8] border border-[#e5e5e0] rounded-lg p-3 text-sm"></textarea>
                    </div>
                    <button type="submit" class="w-full bg-[#262622] text-white py-3.5 rounded-xl font-medium text-sm shadow-md active:scale-95 transition">確認新增</button>
                </form>
            </div>
        </div>

        <!-- 編輯行程 Modal -->
        <div id="editModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 hidden flex items-end justify-center">
            <div class="bg-white w-full max-w-md rounded-t-2xl p-6 max-h-[85vh] overflow-y-auto shadow-2xl">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="font-bold text-base text-[#262622]">編輯行程項目</h3>
                    <button onclick="closeModal('editModal')" class="text-[#8c8c82] text-lg p-2"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <form id="editForm" onsubmit="handleUpdateItem(event)" class="space-y-4">
                    <input type="hidden" id="editItemId">
                    <div>
                        <label class="block text-xs text-[#8c8c82] mb-1">項目分類</label>
                        <select id="editInputType" class="w-full bg-[#fafaf8] border border-[#e5e5e0] rounded-lg p-3 text-sm focus:outline-none focus:border-[#262622]">
                            <option value="attraction">景點 (Attraction)</option>
                            <option value="restaurant">餐廳 (Restaurant)</option>
                            <option value="transport">交通 (Transport)</option>
                        </select>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-xs text-[#8c8c82] mb-1">時間</label>
                            <input type="text" id="editInputTime" required class="w-full bg-[#fafaf8] border border-[#e5e5e0] rounded-lg p-3 text-sm">
                        </div>
                        <div>
                            <label class="block text-xs text-[#8c8c82] mb-1">地點名稱</label>
                            <input type="text" id="editInputLocation" required class="w-full bg-[#fafaf8] border border-[#e5e5e0] rounded-lg p-3 text-sm">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs text-[#8c8c82] mb-1">行程內容與高亮關鍵字</label>
                        <textarea id="editInputDesc" rows="3" required class="w-full bg-[#fafaf8] border border-[#e5e5e0] rounded-lg p-3 text-sm"></textarea>
                    </div>
                    <div class="flex gap-2">
                        <button type="button" onclick="deleteCurrentItem()" class="w-1/3 bg-rose-50 text-rose-600 border border-rose-200 py-3 rounded-xl font-medium text-sm transition">刪除</button>
                        <button type="submit" class="w-2/3 bg-[#262622] text-white py-3 rounded-xl font-medium text-sm shadow-md transition">儲存修改</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- 新增支出 Modal -->
        <div id="expenseModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 hidden flex items-end justify-center">
            <div class="bg-white w-full max-w-md rounded-t-2xl p-6 max-h-[85vh] overflow-y-auto shadow-2xl">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="font-bold text-base text-[#262622]">新增旅費支出</h3>
                    <button onclick="closeModal('expenseModal')" class="text-[#8c8c82] text-lg p-2"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <form id="expenseForm" onsubmit="handleAddExpense(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs text-[#8c8c82] mb-1">支出日期 (年/月/日)</label>
                        <input type="text" id="expDate" placeholder="例如: 2025/09/09" required class="w-full bg-[#fafaf8] border border-[#e5e5e0] rounded-lg p-3 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs text-[#8c8c82] mb-1">支出項目名稱</label>
                        <input type="text" id="expItemName" placeholder="例如: 晚餐燒肉" required class="w-full bg-[#fafaf8] border border-[#e5e5e0] rounded-lg p-3 text-sm">
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-xs text-[#8c8c82] mb-1">幣值</label>
                            <select id="expCurrency" class="w-full bg-[#fafaf8] border border-[#e5e5e0] rounded-lg p-3 text-sm">
                                <option value="JPY">JPY (日圓)</option>
                                <option value="TWD">TWD (台幣)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs text-[#8c8c82] mb-1">金額</label>
                            <input type="number" id="expAmount" placeholder="例: 5000" required class="w-full bg-[#fafaf8] border border-[#e5e5e0] rounded-lg p-3 text-sm">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs text-[#8c8c82] mb-1">付款人 (誰付錢)</label>
                        <select id="expPayer" class="w-full bg-[#fafaf8] border border-[#e5e5e0] rounded-lg p-3 text-sm">
                            <option value="彩庭">彩庭</option>
                            <option value="溫芯">溫芯</option>
                            <option value="俞萱">俞萱</option>
                            <option value="浤緯">浤緯</option>
                        </select>
                    </div>
                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <label class="text-xs text-[#8c8c82]">分攤成員 (可複選，預設所有人)</label>
                            <button type="button" onclick="toggleSelectAll()" class="text-[11px] text-blue-600 font-medium">全選 / 取消全選</button>
                        </div>
                        <div class="grid grid-cols-2 gap-2 bg-[#fafaf8] p-3 rounded-xl border border-[#e5e5e0]">
                            <label class="flex items-center gap-2 text-xs cursor-pointer">
                                <input type="checkbox" name="splitMember" value="彩庭" checked class="rounded border-[#e5e5e0]"> 彩庭
                            </label>
                            <label class="flex items-center gap-2 text-xs cursor-pointer">
                                <input type="checkbox" name="splitMember" value="溫芯" checked class="rounded border-[#e5e5e0]"> 溫芯
                            </label>
                            <label class="flex items-center gap-2 text-xs cursor-pointer">
                                <input type="checkbox" name="splitMember" value="俞萱" checked class="rounded border-[#e5e5e0]"> 俞萱
                            </label>
                            <label class="flex items-center gap-2 text-xs cursor-pointer">
                                <input type="checkbox" name="splitMember" value="浤緯" checked class="rounded border-[#e5e5e0]"> 浤緯
                            </label>
                        </div>
                    </div>
                    <button type="submit" class="w-full bg-[#262622] text-white py-3.5 rounded-xl font-medium text-sm shadow-md active:scale-95 transition">確認新增支出</button>
                </form>
            </div>
        </div>

        <!-- 支出詳情與還款彈跳視窗 (Detail Modal) -->
        <div id="expenseDetailModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
            <div class="bg-white w-full max-w-sm rounded-2xl p-6 shadow-2xl space-y-4 max-h-[85vh] overflow-y-auto animate-in fade-in zoom-in duration-200">
                <div class="flex justify-between items-center border-b border-[#e5e5e0] pb-3">
                    <h3 id="detailTitle" class="font-bold text-base text-[#262622]">帳單詳細資訊</h3>
                    <button onclick="closeModal('expenseDetailModal')" class="text-[#8c8c82] text-lg p-1"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div id="detailContent" class="space-y-3 text-xs text-[#52524a]">
                    <!-- 動態填入還款與分攤明細 -->
                </div>
                <button onclick="closeModal('expenseDetailModal')" class="w-full bg-[#262622] text-white py-2.5 rounded-xl font-medium text-sm transition">關閉</button>
            </div>
        </div>

        <!-- 資料備份與還原彈跳視窗 -->
        <div id="backupModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
            <div class="bg-white w-full max-w-sm rounded-2xl p-6 shadow-2xl space-y-4 max-h-[85vh] overflow-y-auto">
                <div class="flex justify-between items-center border-b border-[#e5e5e0] pb-3">
                    <h3 class="font-bold text-base text-[#262622]">資料備份與還原</h3>
                    <button onclick="closeModal('backupModal')" class="text-[#8c8c82] text-lg p-1"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div class="space-y-3 text-xs text-[#52524a]">
                    <p>若要在重新整理或重開App後保留紀錄，可將下方備份碼複製保存，或貼上還原：</p>
                    <textarea id="backupTextarea" rows="6" class="w-full bg-[#fafaf8] border border-[#e5e5e0] rounded-xl p-3 text-[11px] font-mono focus:outline-none focus:border-[#262622]" placeholder="備份資料會顯示在這裡..."></textarea>
                    <div class="flex gap-2">
                        <button onclick="copyBackupData()" class="flex-1 bg-[#262622] text-white py-2.5 rounded-xl font-medium text-xs">複製備份碼</button>
                        <button onclick="restoreBackupData()" class="flex-1 bg-emerald-600 text-white py-2.5 rounded-xl font-medium text-xs">還原資料</button>
                    </div>
                </div>
                <button onclick="closeModal('backupModal')" class="w-full bg-gray-100 text-[#52524a] py-2.5 rounded-xl font-medium text-xs transition">關閉</button>
            </div>
        </div>

        <!-- 新增/編輯 準備事項 Modal -->
        <div id="prepModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
            <div class="bg-white w-full max-w-md rounded-2xl p-6 max-h-[85vh] overflow-y-auto shadow-2xl">
                <div class="flex justify-between items-center mb-4">
                    <h3 id="prepModalTitle" class="font-bold text-base text-[#262622]">新增待辦或行李項目</h3>
                    <button onclick="closeModal('prepModal')" class="text-[#8c8c82] text-lg p-2"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <form id="prepForm" onsubmit="handleSavePrepItem(event)" class="space-y-4">
                    <input type="hidden" id="prepType">
                    <input type="hidden" id="prepItemId">
                    <div>
                        <label class="block text-xs text-[#8c8c82] mb-1">選擇分類</label>
                        <select id="prepCatSelect" class="w-full bg-[#fafaf8] border border-[#e5e5e0] rounded-lg p-3 text-sm focus:outline-none focus:border-[#262622]">
                            <!-- 動態填入 -->
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs text-[#8c8c82] mb-1">項目內容</label>
                        <input type="text" id="prepItemText" placeholder="請輸入項目名稱..." required class="w-full bg-[#fafaf8] border border-[#e5e5e0] rounded-lg p-3 text-sm">
                    </div>
                    <button type="submit" class="w-full bg-[#262622] text-white py-3.5 rounded-xl font-medium text-sm shadow-md active:scale-95 transition">確認儲存</button>
                </form>
            </div>
        </div>

    </div>

    <script>
        let JPY_EXCHANGE_RATE = 0.21;

        async function fetchLatestExchangeRate() {
            try {
                const response = await fetch('https://open.er-api.com/v6/latest/JPY');
                const data = await response.json();
                if(data && data.rates && data.rates.TWD) {
                    JPY_EXCHANGE_RATE = parseFloat((data.rates.TWD).toFixed(4));
                    saveAppData();
                    render();
                }
            } catch (err) {
                console.log('使用預設即時匯率');
            }
        }

        const defaultAppData = {
            currentTab: 'overview',
            activeDay: 1,
            prepCategories: [
                {
                    category: '出發前確認',
                    items: [
                        { id: 1, text: '航空線上報到、劃位（起飛前48~1.5小時前）', done: false }
                    ]
                },
                {
                    category: '文件與網路',
                    items: [
                        { id: 2, text: '漫遊 / esim', done: false },
                        { id: 3, text: 'Visit Japan Web', done: false }
                    ]
                },
                {
                    category: '財務與保險',

                const parsed = JSON.parse(rawStored);
                appData = {
                    ...defaultAppData,
                    ...parsed,
                    expenses: Array.isArray(parsed.expenses) ? parsed.expenses : [],
                    prepCategories: parsed.prepCategories || defaultAppData.prepCategories,
                    luggageCategories: parsed.luggageCategories || defaultAppData.luggageCategories,
                    hotelNearbyPlaces: parsed.hotelNearbyPlaces || defaultAppData.hotelNearbyPlaces,
                    days: parsed.days || defaultAppData.days
                };
            }
        } catch (e) {
            console.error('LocalStorage 讀取失敗', e);
        }

        function saveAppData() {
            try {
                localStorage.setItem('tokyo_trip_data', JSON.stringify(appData));
            } catch (e) {
                console.error('LocalStorage 寫入失敗', e);
            }
        }

        function openBackupModal() {
            document.getElementById('backupTextarea').value = JSON.stringify(appData);
            openModal('backupModal');
        }

        function copyBackupData() {
            const textarea = document.getElementById('backupTextarea');
            textarea.select();
            document.execCommand('copy');
            alert('備份碼已複製！');
        }

        function restoreBackupData() {
            try {
                const jsonStr = document.getElementById('backupTextarea').value;
                const parsed = JSON.parse(jsonStr);
                if (parsed && parsed.expenses) {
                    appData = parsed;
                    saveAppData();
                    render();
                    closeModal('backupModal');
                    alert('資料還原成功！');
                } else {
                    alert('備份格式不正確！');
                }
            } catch (e) {
                alert('還原失敗，請檢查備份碼是否完整。');
            }
        }

        function switchTab(tabId) {
            appData.currentTab = tabId;
            saveAppData();
            ['overview', 'prep', 'hotel', 'itinerary', 'bills'].forEach(t => {
                const btn = document.getElementById(`nav-btn-${t}`);
                if(t === tabId) {
                    btn.classList.remove('text-[#8c8c82]');
                    btn.classList.add('text-[#262622]', 'font-bold');
                } else {
                    btn.classList.remove('text-[#262622]', 'font-bold');
                    btn.classList.add('text-[#8c8c82]');
                }
            });
            render();
        }

            appData.activeDay = dayNum;

            const cat = appData.prepCategories[catIndex];
            const task = cat.items.find(t => t.id === taskId);
            if(task) { task.done = !task.done; saveAppData(); render(); }
        }

        function deletePrepTask(catIndex, taskId) {
            if(confirm('確定要刪除這個待辦事項嗎？')) {
                const cat = appData.prepCategories[catIndex];
                cat.items = cat.items.filter(t => t.id !== taskId);
                saveAppData();
                render();
            }
        }

        function toggleLuggageItem(categoryName, itemIndex) {
            const cat = appData.luggageCategories.find(c => c.category === categoryName);
            if(cat && cat.items[itemIndex]) {
                cat.items[itemIndex].done = !cat.items[itemIndex].done;
                saveAppData();
                render();
            }
        }

        function deleteLuggageItem(categoryName, itemIndex) {
            if(confirm('確定要刪除這個行李項目嗎？')) {
                const cat = appData.luggageCategories.find(c => c.category === categoryName);
                if(cat) {
                    cat.items.splice(itemIndex, 1);
                    saveAppData();
                    render();
                }
            }

        function openPrepModal(type, categoryName = '') {
            document.getElementById('prepType').value = type;
            document.getElementById('prepItemId').value = '';
            document.getElementById('prepItemText').value = '';
            
            const select = document.getElementById('prepCatSelect');
            select.innerHTML = '';

            if(type === 'prep') {
                document.getElementById('prepModalTitle').innerText = '新增行前待辦事項';
                appData.prepCategories.forEach(cat => {
                    const opt = document.createElement('option');
                    opt.value = cat.category;
                    opt.innerText = cat.category;
                    if(cat.category === categoryName) opt.selected = true;
                    select.appendChild(opt);
                });
            } else {
                document.getElementById('prepModalTitle').innerText = '新增行李打包項目';
                appData.luggageCategories.forEach(cat => {
                    const opt = document.createElement('option');
                    opt.value = cat.category;
                    opt.innerText = cat.category;
                    if(cat.category === categoryName) opt.selected = true;
                    select.appendChild(opt);
                });
            }

            openModal('prepModal');
        }

        function handleSavePrepItem(e) {
            e.preventDefault();
            const type = document.getElementById('prepType').value;
            const targetCategory = document.getElementById('prepCatSelect').value;
            const text = document.getElementById('prepItemText').value;

            if(!text) return;

            if(type === 'prep') {
                const cat = appData.prepCategories.find(c => c.category === targetCategory);
                if(cat) {
                    cat.items.push({ id: Date.now(), text, done: false });
                }
            } else {
                const cat = appData.luggageCategories.find(c => c.category === targetCategory);
                if(cat) {
                    cat.items.push({ text, done: false });
                }
            }

            saveAppData();
            closeModal('prepModal');
            render();
        }

        function openExpenseDetail(expenseId) {
            const ex = appData.expenses.find(e => e.id === expenseId);
            if(!ex) return;

            document.getElementById('detailTitle').innerText = `帳單詳情：${ex.item} (${ex.date || '未填寫日期'})`;
            
            const members = ex.members || ['彩庭', '溫芯', '俞萱', '浤緯'];
            const totalAmount = ex.amount;
            const currency = ex.currency;
            const sharePerPerson = totalAmount / members.length;
            const sharePerPersonTWD = currency === 'JPY' ? sharePerPerson * JPY_EXCHANGE_RATE : sharePerPerson;
            const totalTWD = currency === 'JPY' ? totalAmount * JPY_EXCHANGE_RATE : totalAmount;

            if(!ex.repayments) {
                ex.repayments = {};
                members.forEach(m => {
                    if(m !== ex.payer) ex.repayments[m] = false;
                });
            }

            let html = `
                <div class="bg-[#fafaf8] p-3 rounded-xl border border-[#e5e5e0] space-y-1 mb-3">
                    <div class="flex justify-between"><span>支出日期：</span><strong class="text-[#262622]">${ex.date || '未填寫'}</strong></div>
                    <div class="flex justify-between"><span>付款人 (墊錢)：</span><strong class="text-[#262622]">${ex.payer}</strong></div>
                    <div class="flex justify-between"><span>總金額：</span><strong class="text-[#262622]">${currency === 'JPY' ? 'JP¥ ' + totalAmount.toLocaleString() + ' (≈ NT$ ' + Math.round(totalTWD).toLocaleString() + ')' : 'NT$ ' + totalAmount.toLocaleString()}</strong></div>
                    <div class="flex justify-between"><span>每人應付：</span><strong class="text-rose-600">NT$ ${Math.round(sharePerPersonTWD).toLocaleString()}</strong></div>
                </div>
                <div class="font-bold text-[#262622] mb-1">各成員還款狀況 (點擊勾選劃記已還款)：</div>
                <div class="space-y-1.5">
            `;

            members.forEach(m => {
                if(m === ex.payer) {
                    html += `
                        <div class="flex justify-between items-center bg-emerald-50 p-2.5 rounded-lg border border-emerald-200 text-xs">
                            <span class="font-medium text-emerald-800">${m} (付款人)</span>
                            <span class="text-emerald-700 font-bold">已墊付 / 不需還款</span>
                        </div>
                    `;
                } else {
                    const isPaid = !!ex.repayments[m];
                    html += `
                        <div onclick="toggleRepayment(${ex.id}, '${m}')" class="flex justify-between items-center bg-[#fafaf8] p-2.5 rounded-lg border border-[#e5e5e0] cursor-pointer hover:border-[#262622] transition">
                            <div class="flex items-center gap-2">
                                <input type="checkbox" ${isPaid ? 'checked' : ''} class="w-4 h-4 rounded text-[#262622] focus:ring-0 pointer-events-none">
                                <span class="font-medium text-[#262622] ${isPaid ? 'line-through text-[#8c8c82]' : ''}">${m}</span>
                            </div>
                            <span class="font-bold text-xs ${isPaid ? 'text-emerald-600' : 'text-amber-600'}">
                                ${isPaid ? '已還款 (結清)' : '未還款 (欠 NT$' + Math.round(sharePerPersonTWD).toLocaleString() + ')'}
                            </span>
                        </div>
                    `;
                }
            });

            html += `</div>`;
            document.getElementById('detailContent').innerHTML = html;
            openModal('expenseDetailModal');

        function toggleRepayment(expenseId, memberName) {

                                    <i class="fa-solid fa-diamond-turn-right text-blue-600"></i> 導航
                                </a>
                                <button onclick="openEditModal(${day.day}, ${item.id})" class="bg-[#fafaf8] text-[#666] px-2 py-1 rounded-lg text-xs font-medium border border-[#e5e5e0]">
                                    <i class="fa-solid fa-pen"></i> 編輯
                                </button>
                            </div>
                        </div>
                        <h3 class="font-bold text-sm text-[#262622]">${item.title}</h3>
                        <p class="text-xs text-[#52524a] leading-relaxed">${formatSmartText(item.desc)}</p>
                    </div>
                `;
            });
            html += `</div>`;
            container.innerHTML = html;
        }

        // 分帳分頁 (包含日期顯示與淨額結算)
        function renderBills(container) {
            let totalTWD = 0;
            let totalJPY = 0;
            const defaultMembers = ['彩庭', '溫芯', '俞萱', '浤緯'];
            let netBalances = { '彩庭': 0, '溫芯': 0, '俞萱': 0, '浤緯': 0 };

            appData.expenses.forEach(ex => {
                const members = ex.members || defaultMembers;
                const amountTWD = ex.currency === 'JPY' ? ex.amount * JPY_EXCHANGE_RATE : ex.amount;
                
                totalTWD += amountTWD;
                if(ex.currency === 'JPY') {
                    totalJPY += ex.amount;
                }

                if(!ex.repayments) {
                    ex.repayments = {};
                    members.forEach(m => {
                        if(m !== ex.payer) ex.repayments[m] = false;
                    });
                }

                const sharePerPerson = amountTWD / members.length;
                netBalances[ex.payer] += (amountTWD - sharePerPerson);

                members.forEach(m => {
                    if(m !== ex.payer) {
                        if(ex.repayments[m]) {
                            netBalances[ex.payer] -= sharePerPerson;
                        } else {
                            netBalances[m] -= sharePerPerson;
                        }
                    }
                });
            });

            container.innerHTML = `
                <div class="space-y-4">
                    <div class="bg-white p-4 rounded-2xl shadow-sm border border-[#e5e5e0]">
                        <div class="flex justify-between items-center mb-3">
                            <h3 class="font-bold text-xs text-[#8c8c82] uppercase"><i class="fa-solid fa-wallet text-emerald-500 mr-1.5"></i> 旅費分帳與結算</h3>
                            <div class="flex gap-2">
                                <button onclick="openBackupModal()" class="text-xs bg-[#f3f4f6] text-[#374151] px-2.5 py-1.5 rounded-lg border border-[#e5e5e0] active:scale-95 transition" title="備份或還原資料"><i class="fa-solid fa-cloud-arrow-up mr-1"></i>備份</button>
                                <button onclick="openModal('expenseModal')" class="text-xs bg-[#262622] text-white px-2.5 py-1.5 rounded-lg active:scale-95 transition">新增支出</button>
                            </div>
                        </div>
                        
                        <div class="bg-[#fafaf8] p-3 rounded-xl border border-[#e5e5e0] mb-3 flex justify-between items-center text-xs">
                            <div class="flex items-center gap-2">
                                <i class="fa-solid fa-chart-line text-emerald-600"></i>
                                <span>目前 Google 即時浮動匯率：</span>
                            </div>
                            <span class="font-bold text-[#262622]">1 JPY ≈ ${JPY_EXCHANGE_RATE} TWD</span>
                        </div>

                        <div class="grid grid-cols-2 gap-2 mb-4">
                            <div class="bg-[#fafaf8] p-3 rounded-xl border border-[#e5e5e0] text-center">
                                <div class="text-[10px] text-[#8c8c82]">總支出 (折合台幣)</div>
                                <div class="text-sm font-bold text-[#262622]">NT$ ${Math.round(totalTWD).toLocaleString()}</div>
                            </div>
                            <div class="bg-[#fafaf8] p-3 rounded-xl border border-[#e5e5e0] text-center">
                                <div class="text-[10px] text-[#8c8c82]">日圓總支出</div>
                                <div class="text-sm font-bold text-[#262622]">JP¥ ${totalJPY.toLocaleString()}</div>
                            </div>
                        </div>

                        <h4 class="font-bold text-xs text-[#262622] mb-2">成員結算預覽 (全數結清時自動歸零)</h4>
                        <div class="grid grid-cols-2 gap-2 mb-4">
                            ${defaultMembers.map(name => {
                                const net = Math.round(netBalances[name]);
                                const isPositive = net > 5;
                                const isNegative = net < -5;
                                const absAmt = Math.abs(net);
                                return `
                                    <div class="bg-[#fafaf8] p-2.5 rounded-xl border border-[#e5e5e0] text-xs">
                                        <div class="font-bold text-[#262622]">${name}</div>
                                        <div class="font-bold mt-2 ${!isPositive && !isNegative ? 'text-[#8c8c82]' : (isPositive ? 'text-emerald-600' : 'text-rose-600')}">
                                            ${!isPositive && !isNegative ? '已結清 (±$0)' : (isPositive ? '可拿回 +' : '需支付 -') + 'NT$' + absAmt.toLocaleString()}
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>

                        <h4 class="font-bold text-xs text-[#262622] mb-2">支出明細清單 (點擊卡片設定還款)</h4>
                        <div class="space-y-2">
                            ${appData.expenses.length === 0 ? '<div class="text-center py-6 text-xs text-[#8c8c82]">目前尚無任何分帳紀錄，點擊上方按鈕新增！</div>' : appData.expenses.map(ex => {
                                const convertedTWD = ex.currency === 'JPY' ? Math.round(ex.amount * JPY_EXCHANGE_RATE) : ex.amount;
                                const displayAmount = ex.currency === 'JPY' 
                                    ? `JP¥ ${ex.amount.toLocaleString()} <span class="text-[10px] text-[#8c8c82] font-normal block">≈ NT$ ${convertedTWD.toLocaleString()}</span>` 
                                    : `NT$ ${ex.amount.toLocaleString()}`;

                                const members = ex.members || defaultMembers;
                                const needPayMembers = members.filter(m => m !== ex.payer);
                                const allRepaid = needPayMembers.length > 0 && needPayMembers.every(m => ex.repayments && ex.repayments[m]);

                                return `
                                    <div onclick="openExpenseDetail(${ex.id})" class="flex justify-between items-center text-xs bg-[#fafaf8] p-3 rounded-xl border ${allRepaid ? 'border-emerald-300 bg-emerald-50/40' : 'border-[#e5e5e0]'} cursor-pointer hover:border-[#262622] transition">
                                        <div>
                                            <div class="flex items-center gap-2">
                                                <span class="font-bold text-sm text-[#262622] ${allRepaid ? 'line-through opacity-70' : ''}">${ex.item}</span>
                                                <span class="${allRepaid ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'} text-[9px] px-1.5 py-0.5 rounded font-bold">
                                                    ${allRepaid ? '已全數結清' : '部分未還'}
                                                </span>
                                            </div>
                                            <div class="text-[10px] text-[#8c8c82] mt-0.5">${ex.date ? ex.date + ' · ' : ''}付款人: ${ex.payer}</div>
                                        </div>
                                        <div class="flex items-center gap-3">
                                            <div class="text-right font-bold text-emerald-700">${displayAmount}</div>
                                            <button onclick="event.stopPropagation(); deleteExpense(${ex.id})" class="text-rose-500 p-1" title="刪除"><i class="fa-solid fa-trash-can"></i></button>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function openModal(id) { document.getElementById(id).classList.add('flex'); document.getElementById(id).classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.remove('flex'); document.getElementById(id).classList.add('hidden'); }

        function toggleSelectAll() {
            const checkboxes = document.querySelectorAll('input[name="splitMember"]');
            const allChecked = Array.from(checkboxes).every(cb => cb.checked);
            checkboxes.forEach(cb => cb.checked = !allChecked);
        }

        function handleAddItem(e) {
            e.preventDefault();
            const dayNum = parseInt(document.getElementById('inputDay').value);
            const type = document.getElementById('inputType').value;
            const time = document.getElementById('inputTime').value;
            const title = document.getElementById('inputLocation').value;
            const desc = document.getElementById('inputDesc').value;

            const target = appData.days.find(d => d.day === dayNum);
            if(target) {
                target.items.push({ id: Date.now(), type, time, title, desc });
            }
            saveAppData();
            closeModal('addModal');
            document.getElementById('addForm').reset();
            appData.activeDay = dayNum;
            switchTab('itinerary');
        }

        function handleAddExpense(e) {
            e.preventDefault();
            const date = document.getElementById('expDate').value;
            const item = document.getElementById('expItemName').value;
            const currency = document.getElementById('expCurrency').value;
            const amount = parseFloat(document.getElementById('expAmount').value);
            const payer = document.getElementById('expPayer').value;
            
            const memberCheckboxes = document.querySelectorAll('input[name="splitMember"]:checked');
            const members = Array.from(memberCheckboxes).map(cb => cb.value);

            if(!item || isNaN(amount) || members.length === 0) {
                alert('請完整填寫項目、金額並至少選擇一位分攤成員！');
                return;
            }

            let repayments = {};
            members.forEach(m => {
                if(m !== payer) repayments[m] = false;
            });

            appData.expenses.push({ id: Date.now(), date, item, currency, amount, payer, members, repayments });
            saveAppData();
            closeModal('expenseModal');
            document.getElementById('expenseForm').reset();
            const today = new Date();
            const expDateEl = document.getElementById('expDate');
            if(expDateEl) {
                expDateEl.value = `${today.getFullYear()}/${String(today.getMonth() + 1).padStart(2, '0')}/${String(today.getDate()).padStart(2, '0')}`;
            }
            document.querySelectorAll('input[name="splitMember"]').forEach(cb => cb.checked = true);
            render();
        }

        let editingContext = { dayNum: null, itemId: null };

        function openEditModal(dayNum, itemId) {
            editingContext = { dayNum, itemId };
            const day = appData.days.find(d => d.day === editingContext.dayNum);
            const item = day.items.find(i => i.id === itemId);
            if(!item) return;

            document.getElementById('editInputType').value = item.type;
            document.getElementById('editInputTime').value = item.time;
            document.getElementById('editInputLocation').value = item.title;
            document.getElementById('editInputDesc').value = item.desc;
            openModal('editModal');
        }

        function handleUpdateItem(e) {
            e.preventDefault();
            const day = appData.days.find(d => d.day === editingContext.dayNum);
            const item = day.items.find(i => i.id === editingContext.itemId);
            if(item) {
                item.type = document.getElementById('editInputType').value;
                item.time = document.getElementById('editInputTime').value;
                item.title = document.getElementById('editInputLocation').value;
                item.desc = document.getElementById('editInputDesc').value;
            }
            saveAppData();
            closeModal('editModal');
            render();
        }

        function deleteCurrentItem() {
            if(confirm('確定要刪除這個行程項目嗎？')) {
                const day = appData.days.find(d => d.day === editingContext.dayNum);
                day.items = day.items.filter(i => i.id !== editingContext.itemId);
                saveAppData();
                closeModal('editModal');
                render();
            }
        }

        function editFlightInfo() {
            const newFlight = prompt('請輸入新的去程航班資訊：', appData.flights[0]);
            if(newFlight) appData.flights[0] = newFlight;
            saveAppData();
            render();
        }

        function editHotelInfo() {
            const newHotel = prompt('請輸入新的飯店名稱：', appData.hotel.name);
            if(newHotel) appData.hotel.name = newHotel;
            saveAppData();
            render();
        }

        function deleteExpense(id) {
            appData.expenses = appData.expenses.filter(e => e.id !== id);
            saveAppData();
            render();
        }

        // 初始化預設日期
        const today = new Date();
        const expDateEl = document.getElementById('expDate');
        if(expDateEl) {
            expDateEl.value = `${today.getFullYear()}/${String(today.getMonth() + 1).padStart(2, '0')}/${String(today.getDate()).padStart(2, '0')}`;
        }

        fetchLatestExchangeRate();
        render();
    </script>
</body>
</html>
